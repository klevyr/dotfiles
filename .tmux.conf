#set -g default-terminal "screen-256color"
set-option -ga terminal-overrides ",xterm*:Tc"

unbind r
bind r source-file ~/.tmux.conf

# prefix key
set -g prefix c-s

# change split panes
bind \\ split-window -h -c "#{pane_current_path}"
unbind %

#bind '"' split-window -v -c "#{pane_current_path}"
#unbind '"'

# act like vim
setw -g mode-keys vi

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# options
set -sg escape-time 10
set -g mouse on

# start windows and panes at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# list of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'xamut/tmux-weather'
set -g @plugin 'tmux-plugins/tmux-yank'

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha" # latte, frappe, mocha, macchiato
set -g @catppuccin_window_status_style "slanted" # rounded, basic
set -g @catppuccin_status_background "default" # default
set -g @catppuccin_window_current_number_color "#{@thm_green}"

# tmux-weather
set-option -g @tmux-weather-location "Quito"

# Load catppuccin
run ~/.tmux/plugins/catppuccin/tmux/catppuccin.tmux
# For TPM, instead use `run ~/.config/tmux/plugins/tmux/catppuccin.tmux`

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
#set -agF status-right "#{@catppuccin_status_gitmux}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
# memory
set -ag status-right "#[bg=#{@thm_flamingo}]#[reverse]#[noreverse]󱀙  "
set -ag status-right "#[fg=#{@thm_fg},bg=#{@thm_surface_0}] #(free -mt | awk '/Mem:/ {print $7}') MB "
#set -agF status-right "#{E:@catppuccin_status_weather}"
set -agF status-right "#{E:@catppuccin_status_date_time}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -ag status-right "#{E:@catppuccin_status_session}"
# path in status
##set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#{b:pane_current_path}"
set -g @catppuccin_window_text "#{b:pane_current_command}"

run ~/.tmux/plugins/tmux-cpu/cpu.tmux
# init tmux plugin manager
run ~/.tmux/plugins/tpm/tpm

